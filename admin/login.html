<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Admin Login — JK Mobiles</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🔐</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --blue: #0A2463;
      --blue-mid: #1E4FC2;
      --orange: #FF6B00;
      --white: #FFFFFF;
      --gray-100: #EEF2FF;
      --gray-200: #E0E7FF;
      --gray-600: #6B7280;
      --radius: 12px;
      --radius-lg: 20px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Nunito', sans-serif;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0A2463 0%, #0D3080 50%, #1A4FAD 100%);
      position: relative;
      overflow: hidden;
    }

    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background:
        radial-gradient(circle at 80% 20%, rgba(255,107,0,0.15) 0%, transparent 50%),
        radial-gradient(circle at 10% 80%, rgba(58,123,213,0.2) 0%, transparent 45%);
    }

    .grid-bg {
      position: absolute;
      inset: 0;
      background-image:
        linear-gradient(rgba(255,255,255,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,0.03) 1px, transparent 1px);
      background-size: 50px 50px;
    }

    .login-card {
      background: rgba(255,255,255,0.97);
      border-radius: var(--radius-lg);
      padding: 3rem 2.5rem;
      width: 100%;
      max-width: 420px;
      position: relative;
      z-index: 2;
      box-shadow: 0 30px 80px rgba(0,0,0,0.35);
      border: 1px solid rgba(255,255,255,0.5);
      animation: slideUp 0.6s cubic-bezier(0.4,0,0.2,1) both;
    }

    @keyframes slideUp {
      from { opacity:0; transform: translateY(40px); }
      to   { opacity:1; transform: translateY(0); }
    }

    .login-logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, var(--blue), var(--blue-mid));
      border-radius: 22px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2.4rem;
      margin: 0 auto 1.5rem;
      box-shadow: 0 10px 30px rgba(10,36,99,0.3);
    }

    .login-title {
      font-family: 'Rajdhani', sans-serif;
      font-size: 1.8rem;
      font-weight: 700;
      color: var(--blue);
      text-align: center;
      margin-bottom: 0.25rem;
    }

    .login-subtitle {
      text-align: center;
      color: var(--gray-600);
      font-size: 0.88rem;
      margin-bottom: 2rem;
    }

    .form-group { margin-bottom: 1.2rem; }

    .jk-label {
      display: block;
      font-weight: 700;
      font-size: 0.88rem;
      color: var(--blue);
      margin-bottom: 6px;
    }

    .jk-input {
      width: 100%;
      padding: 0.75rem 1rem;
      border: 2px solid var(--gray-200);
      border-radius: var(--radius);
      font-family: 'Nunito', sans-serif;
      font-size: 0.95rem;
      color: #1F2937;
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .jk-input:focus {
      border-color: var(--blue-mid);
      box-shadow: 0 0 0 4px rgba(30,79,194,0.12);
    }

    .input-wrap { position: relative; }

    .toggle-pw {
      position: absolute;
      right: 12px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1.1rem;
      color: var(--gray-600);
      padding: 0;
    }

    .btn-login {
      width: 100%;
      padding: 0.9rem;
      background: linear-gradient(135deg, var(--blue), var(--blue-mid));
      color: white;
      border: none;
      border-radius: var(--radius);
      font-family: 'Rajdhani', sans-serif;
      font-weight: 700;
      font-size: 1.1rem;
      letter-spacing: 0.06em;
      cursor: pointer;
      transition: all 0.3s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 4px 15px rgba(10,36,99,0.3);
      margin-top: 0.5rem;
    }

    .btn-login:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 8px 25px rgba(10,36,99,0.4);
    }

    .btn-login:disabled { opacity: 0.7; cursor: not-allowed; }

    .alert-box {
      padding: 0.9rem 1.1rem;
      border-radius: var(--radius);
      font-size: 0.88rem;
      font-weight: 600;
      margin-bottom: 1.2rem;
      display: none;
    }

    .alert-error {
      background: #FEF2F2;
      color: #991B1B;
      border: 1px solid #FECACA;
    }

    .spinner {
      width: 18px;
      height: 18px;
      border: 3px solid rgba(255,255,255,0.4);
      border-top-color: white;
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      display: none;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 1.5rem;
      color: var(--gray-600);
      font-size: 0.85rem;
      text-decoration: none;
    }

    .back-link:hover { color: var(--blue); }

    .divider {
      height: 1px;
      background: var(--gray-200);
      margin: 1.5rem 0;
    }

    .demo-creds {
      background: var(--gray-100);
      border-radius: var(--radius);
      padding: 0.9rem 1rem;
      font-size: 0.82rem;
      color: var(--gray-600);
      border: 1px solid var(--gray-200);
    }

    .demo-creds strong { color: var(--blue); }

    /* Mobile Responsive */
    @media (max-width: 576px) {
      body {
        padding: 1rem;
      }

      .login-card {
        padding: 2rem 1.5rem;
        max-width: 100%;
      }

      .login-logo {
        width: 60px;
        height: 60px;
        font-size: 1.8rem;
      }

      .login-title {
        font-size: 1.5rem;
      }

      .login-subtitle {
        font-size: 0.85rem;
      }

      .demo-creds {
        font-size: 0.75rem;
        padding: 0.75rem;
      }

      .demo-creds code {
        font-size: 0.7rem;
      }
    }

    @media (max-width: 375px) {
      .login-card {
        padding: 1.5rem 1.2rem;
      }

      .btn-login {
        font-size: 1rem;
        padding: 0.8rem;
      }
    }
  </style>
</head>
<body>
  <div class="grid-bg"></div>

  <div class="login-card">
    <div class="login-logo">🔐</div>
    <div class="login-title">Admin Portal</div>
    <div class="login-subtitle">JK Mobiles Training Institute</div>

    <div class="alert-box alert-error" id="alertBox"></div>

    <div class="form-group">
      <label class="jk-label">📧 Email Address</label>
      <input type="email" id="email" class="jk-input" placeholder="admin@jkmobiles.com" autocomplete="email">
    </div>

    <div class="form-group">
      <label class="jk-label">🔒 Password</label>
      <div class="input-wrap">
        <input type="password" id="password" class="jk-input" placeholder="Enter your password" style="padding-right:2.8rem;" autocomplete="current-password">
        <button class="toggle-pw" type="button" id="togglePw" onclick="togglePassword()">👁</button>
      </div>
    </div>

    <button class="btn-login" id="loginBtn" onclick="doLogin()">
      <span id="btnText">🔐 Login</span>
      <div class="spinner" id="spinner"></div>
    </button>

    <div class="divider"></div>

    <div class="demo-creds">
      <strong>Default credentials</strong> (change after first login)<br>
      Email: <strong>admin@jkmobiles.com</strong> &nbsp;|&nbsp; Password: <strong>Admin@123</strong><br>
      <em>Run <code>/admin/setup</code> once to initialize.</em>
    </div>

    <a href="../index.html" class="back-link">← Back to Website</a>
  </div>

  <script>
    // const API_BASE = 'https://jk-mobiles-api.onrender.com'; // ← update after deploy
    // API Base URL - Automatically switches between local and production
    const API_BASE = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1' 
      ? 'http://localhost:5000' 
      : 'https://jk-mobiles-api.onrender.com';
    const isDemoMode = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

    // Redirect if already logged in
    if (localStorage.getItem('jk_admin_token')) {
      window.location.href = 'dashboard.html';
    }

    function togglePassword() {
      const input = document.getElementById('password');
      input.type = input.type === 'password' ? 'text' : 'password';
    }

    function showError(msg) {
      const el = document.getElementById('alertBox');
      el.textContent = '❌ ' + msg;
      el.style.display = 'block';
    }

    document.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') doLogin();
    });

    async function doLogin() {
      const email = document.getElementById('email').value.trim();
      const password = document.getElementById('password').value;

      if (!email || !password) { showError('Please enter both email and password.'); return; }

      const btn = document.getElementById('loginBtn');
      const btnText = document.getElementById('btnText');
      const spinner = document.getElementById('spinner');
      document.getElementById('alertBox').style.display = 'none';

      btn.disabled = true;
      btnText.style.display = 'none';
      spinner.style.display = 'block';

      // Demo mode - bypass actual login
      if (isDemoMode) {
        await new Promise(r => setTimeout(r, 800)); // Simulate delay
        if (email === 'admin@jkmobiles.com' && password === 'Admin@123') {
          localStorage.setItem('jk_admin_token', 'demo_token');
          localStorage.setItem('jk_admin_email', email);
          window.location.href = 'dashboard.html';
        } else {
          showError('Invalid credentials. Use: admin@jkmobiles.com / Admin@123');
        }
        btn.disabled = false;
        btnText.style.display = 'inline';
        spinner.style.display = 'none';
        return;
      }

      try {
        const res = await fetch(`${API_BASE}/admin/login`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email, password }),
        });
        const data = await res.json();

        if (res.ok && data.token) {
          localStorage.setItem('jk_admin_token', data.token);
          localStorage.setItem('jk_admin_email', data.email);
          window.location.href = 'dashboard.html';
        } else {
          showError(data.message || 'Login failed. Check credentials.');
        }
      } catch (err) {
        showError('Network error. Is the backend running?');
      } finally {
        btn.disabled = false;
        btnText.style.display = 'inline';
        spinner.style.display = 'none';
      }
    }
  </script>
</body>
</html>
