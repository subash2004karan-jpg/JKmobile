<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Verify Certificate — JK Mobiles</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>📱</text></svg>">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <style>
    .verify-section {
      min-height: 100vh;
      background: linear-gradient(135deg, var(--blue) 0%, #0D3080 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 2rem 1rem;
    }

    .verify-card {
      background: white;
      border-radius: var(--radius-lg);
      padding: 3rem;
      max-width: 600px;
      width: 100%;
      box-shadow: var(--shadow-lg);
      text-align: center;
    }

    .verify-icon {
      width: 100px;
      height: 100px;
      background: linear-gradient(135deg, var(--gray-100), var(--gray-200));
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 3rem;
      margin: 0 auto 1.5rem;
    }

    .verify-title {
      font-size: 2rem;
      color: var(--blue);
      margin-bottom: 0.5rem;
    }

    .verify-subtitle {
      color: var(--gray-600);
      margin-bottom: 2rem;
    }

    .verify-input {
      width: 100%;
      padding: 1rem 1.5rem;
      border: 2px solid var(--gray-200);
      border-radius: 50px;
      font-size: 1.1rem;
      text-align: center;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      margin-bottom: 1rem;
      transition: all 0.3s;
    }

    .verify-input:focus {
      outline: none;
      border-color: var(--blue-mid);
      box-shadow: 0 0 0 4px rgba(30,79,194,0.12);
    }

    .verify-input::placeholder {
      text-transform: none;
      letter-spacing: normal;
      font-size: 0.95rem;
    }

    .verify-btn {
      width: 100%;
      padding: 1rem;
      font-size: 1.1rem;
    }

    .result-card {
      display: none;
      margin-top: 2rem;
      padding: 2rem;
      border-radius: var(--radius);
      text-align: left;
    }

    .result-card.valid {
      display: block;
      background: #ECFDF5;
      border: 2px solid #A7F3D0;
    }

    .result-card.invalid {
      display: block;
      background: #FEF2F2;
      border: 2px solid #FECACA;
    }

    .result-icon {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 2rem;
      margin: 0 auto 1rem;
    }

    .result-card.valid .result-icon {
      background: #10B981;
      color: white;
    }

    .result-card.invalid .result-icon {
      background: #EF4444;
      color: white;
    }

    .result-title {
      font-size: 1.3rem;
      font-weight: 700;
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .result-card.valid .result-title {
      color: #065F46;
    }

    .result-card.invalid .result-title {
      color: #991B1B;
    }

    .detail-row {
      display: flex;
      justify-content: space-between;
      padding: 0.75rem 0;
      border-bottom: 1px solid rgba(0,0,0,0.1);
    }

    .detail-row:last-child {
      border-bottom: none;
    }

    .detail-label {
      font-weight: 600;
      color: var(--gray-600);
    }

    .detail-value {
      font-weight: 700;
      color: var(--blue);
    }

    .back-link {
      display: inline-block;
      margin-top: 2rem;
      color: var(--gray-600);
      text-decoration: none;
      transition: color 0.3s;
    }

    .back-link:hover {
      color: var(--blue);
    }

    @media (max-width: 576px) {
      .verify-card {
        padding: 2rem 1.5rem;
      }

      .verify-title {
        font-size: 1.5rem;
      }

      .verify-icon {
        width: 80px;
        height: 80px;
        font-size: 2.5rem;
      }
    }
  </style>
</head>
<body>

<div class="verify-section">
  <div class="verify-card">
    <div class="verify-icon">🔍</div>
    <h1 class="verify-title">Verify Certificate</h1>
    <p class="verify-subtitle">Enter the certificate ID to verify its authenticity</p>

    <input 
      type="text" 
      id="certIdInput" 
      class="verify-input" 
      placeholder="Enter Certificate ID (e.g., JKM-2026-001)"
      maxlength="12"
    >

    <button class="btn-orange-jk verify-btn btn-glow" onclick="verifyCertificate()">
      Verify Certificate
    </button>

    <div id="resultContainer"></div>

    <a href="index.html" class="back-link">← Back to Home</a>
  </div>
</div>

<script src="js/config.js"></script>
<script>
  const isDemoMode = window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1';

  // Mock data for demo
  const MOCK_CERTIFICATES = {
    'JKM-2026-001': { 
      studentName: 'Jeevan', 
      course: 'Basic', 
      mode: 'Offline', 
      completedAt: new Date().toISOString(),
      issueDate: new Date().toLocaleDateString('en-IN')
    },
    'JKM-2026-002': { 
      studentName: 'Subash', 
      course: 'Advanced', 
      mode: 'Online', 
      completedAt: new Date().toISOString(),
      issueDate: new Date().toLocaleDateString('en-IN')
    },
  };

  async function verifyCertificate() {
    const certId = document.getElementById('certIdInput').value.trim().toUpperCase();
    const resultContainer = document.getElementById('resultContainer');

    if (!certId) {
      showResult('invalid', 'Please enter a certificate ID');
      return;
    }

    if (!certId.match(/^JKM-\d{4}-\d{3}$/)) {
      showResult('invalid', 'Invalid certificate ID format. Use: JKM-YYYY-XXX');
      return;
    }

    // Demo mode
    if (isDemoMode) {
      await new Promise(r => setTimeout(r, 800)); // Simulate delay
      
      // Check localStorage first
      const savedStudents = JSON.parse(localStorage.getItem('jk_students') || '[]');
      const savedStudent = savedStudents.find(s => s.certificateId === certId && s.completed);
      
      if (savedStudent) {
        showResult('valid', {
          certificateId: certId,
          studentName: savedStudent.name,
          course: savedStudent.course,
          mode: savedStudent.mode,
          issueDate: new Date(savedStudent.completedAt).toLocaleDateString('en-IN')
        });
        return;
      }
      
      // Check mock data
      const mockData = MOCK_CERTIFICATES[certId];
      if (mockData) {
        showResult('valid', {
          certificateId: certId,
          ...mockData
        });
        return;
      }
      
      showResult('invalid', 'Certificate not found. The ID may be invalid or the certificate does not exist.');
      return;
    }

    // Real API call
    try {
      const result = await apiRequest(`/students/verify/${certId}`);
      if (result.ok && result.data.valid) {
        showResult('valid', result.data.certificate);
      } else {
        showResult('invalid', result.data.message || 'Certificate verification failed');
      }
    } catch (err) {
      showResult('invalid', 'Network error. Please try again.');
    }
  }

  function showResult(type, data) {
    const resultContainer = document.getElementById('resultContainer');
    
    if (type === 'valid') {
      resultContainer.innerHTML = `
        <div class="result-card valid">
          <div class="result-icon">✓</div>
          <h3 class="result-title">Valid Certificate</h3>
          <div class="detail-row">
            <span class="detail-label">Certificate ID</span>
            <span class="detail-value">${data.certificateId}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Student Name</span>
            <span class="detail-value">${data.studentName}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Course</span>
            <span class="detail-value">${data.course}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Mode</span>
            <span class="detail-value">${data.mode}</span>
          </div>
          <div class="detail-row">
            <span class="detail-label">Issue Date</span>
            <span class="detail-value">${data.issueDate}</span>
          </div>
        </div>
      `;
    } else {
      resultContainer.innerHTML = `
        <div class="result-card invalid">
          <div class="result-icon">✕</div>
          <h3 class="result-title">Invalid Certificate</h3>
          <p style="text-align: center; color: #991B1B; margin: 0;">${data}</p>
        </div>
      `;
    }
  }

  // Allow Enter key to submit
  document.getElementById('certIdInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') {
      verifyCertificate();
    }
  });
</script>

</body>
</html>
